[general]
db_path = "/var/lib/sanalu/sanalu.redb"
ip_db_path = "/var/lib/sanalu/ip_asn_geo.bin"
whitelist = []

[nginx]
enabled = true
find_time = "10m"
max_retry = 1
ban_tiers = ["15m", "1h", "24h", "permanent"]
probe_instant_ban = true
allowed_endpoints = []

[ssh]
enabled = true
find_time = "10m"
max_retry = 5
ban_tiers = ["15m", "1h", "24h", "permanent"]

[bots]
blocked_categories = [
    "security_testing",
    "bad_scraper",
    "generic_tools"
]

[asn_rules]
enabled = true
restricted_asns = []
allowed_regions = []
blocked_asns = []

[cloudflare]
enabled = false
api_token = ""
zone_id = ""
rule_name = "sanalu_auto_block"
action = "block"
max_rule_chars = 3950
sync_batch_seconds = 5
