[package]
name = "sanalu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sanalu Contributors"]
description = "Ultra-lightweight, high-performance security daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chay22/sanalu"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
redb = "2.3"
thiserror = "2.0"
aho-corasick = "1.1"
regex = "1.11"
notify = "7.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
walkdir = "2.5"
flate2 = "1.1.10"
clap_complete = "4.6.9"

[dev-dependencies]
tempfile = "3.17"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[package.metadata.deb]
maintainer = "Sanalu Contributors"
copyright = "2026 Sanalu Contributors"
license-file = ["LICENSE", "4"]
extended-description = "High-performance security daemon with zero-conflict nftables and Cloudflare WAF integration"
section = "net"
priority = "optional"
assets = [
    ["target/release/sanalu", "usr/bin/sanalu", "755"],
    ["dist/systemd/sanalu.service", "lib/systemd/system/sanalu.service", "644"],
    ["dist/sanalu.toml", "etc/sanalu/sanalu.toml", "640"],
    ["dist/completions/sanalu", "usr/share/bash-completion/completions/sanalu", "644"],
]
conf-files = ["/etc/sanalu/sanalu.toml"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
