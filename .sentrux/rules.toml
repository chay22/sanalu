[constraints]
max_cycles = 0
max_coupling = "B"
max_cc = 25
no_god_files = true

[[layers]]
name = "cli"
paths = ["src/cli/**", "src/main.rs"]
order = 0

[[layers]]
name = "services"
paths = [
    "src/cloudflare/**",
    "src/discovery/**",
    "src/ipc/**",
    "src/daemon.rs",
    "src/uninstall/**",
]
order = 1

[[layers]]
name = "domain"
paths = [
    "src/storage/**",
    "src/firewall/**",
    "src/geo/**",
    "src/parser/**",
    "src/intelligence/**",
    "src/engine/**",
]
order = 2

[[layers]]
name = "core"
paths = ["src/error.rs", "src/config/**"]
order = 3

[[boundaries]]
from = "src/storage/**"
to = "src/cloudflare/**"
reason = "Storage must be an independent persistence layer and never depend on external cloud services"

[[boundaries]]
from = "src/firewall/**"
to = "src/ipc/**"
reason = "Low-level firewall packet filtering must not depend on IPC presentation logic"

[[boundaries]]
from = "src/geo/**"
to = "src/daemon.rs"
reason = "Offline IP lookup database must remain standalone and not depend on daemon lifecycle"

[[boundaries]]
from = "src/daemon.rs"
to = "src/cli/**"
reason = "Daemon service must never depend on CLI commands or argument parsing"

[[boundaries]]
from = "src/engine/**"
to = "src/cli/**"
reason = "Threat detection engine must not depend on CLI interface"

[[boundaries]]
from = "src/storage/**"
to = "src/ipc/**"
reason = "Storage engine must not depend on IPC presentation logic"

[[boundaries]]
from = "src/parser/**"
to = "src/storage/**"
reason = "Log parsers must remain pure transformers and not depend on storage"

[[boundaries]]
from = "src/intelligence/**"
to = "src/firewall/**"
reason = "Threat intelligence classification must not directly execute firewall packet operations"

